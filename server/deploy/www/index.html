<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tanmy 个人网站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, #fff5f3 0%, #f0faf7 100%);
      color: #3d3d3d;
      padding: 24px;
    }
    main {
      max-width: 520px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 12px;
      color: #2c2c2c;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #666;
    }
    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <h1>tanmy 个人网站</h1>
    <p>本站为个人学习与技术实践用途，用于展示本人开发的移动应用作品介绍。非经营性，无公开注册与收费。</p>
    <footer>tanmystudio.site</footer>

</html>
