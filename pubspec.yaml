name: nonsense_prophet
description: 基于手机传感器的无厘头预言 App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  battery_plus: ^6.0.3
  sensors_plus: ^5.0.1
  pedometer_2: ^5.0.4
  screen_brightness: ^1.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  volume_controller: ^3.4.0
  flutter_local_ai: ^0.0.6
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  light: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon_1024.png
  adaptive_icon_background: "#FFF8F3"
  adaptive_icon_foreground: assets/icon/app_icon_1024.png
  macos:
    generate: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
          weight: 400
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf