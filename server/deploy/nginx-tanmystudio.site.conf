# tanmystudio.site — Nginx 反代拾页 / 废话预言家 API
# 安装：见 DEPLOY_HTTPS.md

server {
    listen 443 ssl;
    server_name tanmystudio.site www.tanmystudio.site;

    ssl_certificate     /etc/nginx/ssl/tanmystudio.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/tanmystudio.site.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/tanmystudio.site;
    index index.html;

    # 备案首页与静态页（如 privacy.html）；其余路径反代 API
    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name tanmystudio.site www.tanmystudio.site;
    return 301 https://$host$request_uri;
}
